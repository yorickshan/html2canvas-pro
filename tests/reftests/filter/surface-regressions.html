<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Filter surface regressions</title>
        <script src="../../../dist/html2canvas-pro.js"></script>
        <style>
            body {
                margin: 0;
                background: white;
                font-family: sans-serif;
            }
            .stage {
                position: relative;
                width: 280px;
                height: 220px;
                margin: 20px;
            }
            .piece {
                position: absolute;
                top: 80px;
                left: 80px;
                width: 80px;
                height: 60px;
                background: #176b70;
            }
            .piece + .piece {
                left: 120px;
            }
            .layer {
                position: absolute;
                inset: 0;
            }
            .filtered {
                filter: blur(4px) drop-shadow(-18px 8px 8px rgba(0, 0, 0, 0.6));
                opacity: 0.5;
            }
        </style>
    </head>
    <body>
        <div class="stage" id="combined">
            <div class="layer filtered">
                <div class="piece"></div>
                <div class="piece"></div>
            </div>
        </div>
        <div class="stage" id="z-order">
            <div class="piece" style="background: #c33; left: 30px; z-index: -1"></div>
            <div class="layer filtered" style="z-index: 1">
                <div class="piece" style="z-index: -1"></div>
                <div class="piece" style="background: #d9b25e; z-index: 2"></div>
            </div>
            <div class="piece" style="left: 160px; background: #34235c; z-index: 3"></div>
        </div>
        <div class="stage" id="nested-outset">
            <div
                style="
                    position: absolute;
                    left: 90px;
                    top: 65px;
                    width: 100px;
                    height: 70px;
                    filter: blur(3px);
                    opacity: 0.5;
                "
            >
                <div
                    style="
                        position: absolute;
                        left: -35px;
                        top: 5px;
                        width: 120px;
                        height: 60px;
                        filter: blur(2px) drop-shadow(-20px -15px 6px #222);
                        background: #176b70;
                    "
                ></div>
            </div>
        </div>
        <div class="stage" id="text-box-shadow">
            <div
                style="
                    position: absolute;
                    left: 90px;
                    top: 80px;
                    width: 100px;
                    height: 40px;
                    filter: blur(2px);
                    opacity: 0.5;
                    background: #176b70;
                    box-shadow: -25px 20px 8px 3px #333;
                    color: white;
                    font: 24px sans-serif;
                    text-shadow: 20px -15px 5px #c33;
                    white-space: nowrap;
                "
            >
                Overflow text
            </div>
        </div>
        <div class="stage" id="rounded-box-shadow">
            <div
                style="
                    position: absolute;
                    left: 90px;
                    top: 75px;
                    width: 100px;
                    height: 70px;
                    border-radius: 20px;
                    box-shadow:
                        -16px 12px 10px 2px #3339,
                        10px -12px 4px -3px #c339;
                    filter: blur(2px);
                    opacity: 0.5;
                "
            ></div>
        </div>
        <div class="stage" id="unsupported">
            <div class="layer" id="unsupported-ancestor">
                <div class="layer filtered" id="unsupported-layer">
                    <div class="piece"></div>
                    <div class="piece" id="unsupported-child"></div>
                </div>
            </div>
        </div>
    </body>
</html>
